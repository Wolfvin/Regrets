# SonarCloud Configuration
# https://sonarcloud.io/documentation/project-administration/analysis-parameters/

sonar.projectKey=Wolfvin_Regrets
sonar.organization=wolfvin

# Markdown files are documentation, not code. Duplication detection on
# markdown tables (e.g. the 31-row stack support table in README.md / SKILL.md)
# produces false positives that block PRs without indicating real code quality
# issues. Excluded from: duplication, coverage, complexity, and issue detection.
sonar.exclusions=**/*.md, **/proof/**, **/proofs/**, **/references/**

# Test files: tracked for coverage but excluded from duplication/complexity gates
sonar.test.exclusions=**/tests/fixtures/**

# What counts as a test file (for coverage purposes)
sonar.tests=tests/

# Language: JavaScript + TypeScript are the primary code; Python is secondary
sonar.languages=js,ts
