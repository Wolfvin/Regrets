name: Validate on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Validate regrets (if regrets/ exists)
        run: |
          if [ -d "regrets" ]; then
            node scripts/regret.js validate --fail-fast
          else
            echo "No regrets/ directory — skipping validate step"
          fi
