name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 18.x dropped: 63 test files use `import.meta.dirname`
        # (available since Node 20.11). On Node 18.20.8 it returns undefined,
        # causing `path.resolve(undefined, ...)` → ERR_INVALID_ARG_TYPE.
        # See PR #545 for context. Re-add 18.x only if those tests are
        # rewritten to avoid `import.meta.dirname`.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
